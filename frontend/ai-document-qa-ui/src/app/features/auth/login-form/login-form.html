<header class="auth-heading">
  <app-logo-mark [size]="44" />
  <div>
    <h2>Welcome Back</h2>
    <p>Sign in to continue to KnowHub AI</p>
  </div>
</header>

@if (error()) {
  <div class="alert error" role="alert">{{ error() }}</div>
}
@if (info()) {
  <div class="alert info" role="status">{{ info() }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label class="field">
    <span class="field-label">Email Address</span>
    <span class="input-wrap" [class.invalid]="showError('email')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m4 7 8 6 8-6" />
      </svg>
      <input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
    </span>
    @if (showError('email')) {
      <p class="field-error">
        {{ form.controls.email.hasError('required') ? 'Email is required.' : 'Enter a valid email address.' }}
      </p>
    }
  </label>

  <label class="field">
    <span class="field-label">Password</span>
    <span class="input-wrap" [class.invalid]="showError('password')">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17 10V8A5 5 0 0 0 7 8v2a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM9 8a3 3 0 0 1 6 0v2H9z" />
      </svg>
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      />
      <button
        type="button"
        class="icon-button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword()"
      >
        @if (showPassword()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        }
      </button>
    </span>
    @if (showError('password')) {
      <p class="field-error">Password is required.</p>
    }
  </label>

  <div class="form-row">
    <label class="checkbox">
      <input type="checkbox" formControlName="rememberMe" />
      Remember me
    </label>
    <button type="button" class="text-link" (click)="forgotPassword()">Forgot password?</button>
  </div>

  <button type="submit" class="btn-primary" [disabled]="submitting()">
    @if (submitting()) {
      <span class="spinner" aria-hidden="true"></span>
      <span class="sr-only">Signing in</span>
    } @else {
      Sign In
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    }
  </button>
</form>

<app-social-buttons />

<p class="switch-prompt">Don't have an account? <a routerLink="/register">Create one</a></p>
