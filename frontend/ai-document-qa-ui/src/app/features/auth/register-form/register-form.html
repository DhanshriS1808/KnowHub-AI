<header class="auth-heading">
  <app-logo-mark [size]="44" />
  <div>
    <h2>Create your account</h2>
    <p>Join KnowHub AI in less than a minute</p>
  </div>
</header>

@if (error()) {
  <div class="alert error" role="alert">{{ error() }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label class="field">
    <span class="field-label">Full Name</span>
    <span class="input-wrap" [class.invalid]="showError('fullName')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </svg>
      <input type="text" formControlName="fullName" placeholder="Jane Doe" autocomplete="name" />
    </span>
    @if (showError('fullName')) {
      <p class="field-error">
        @if (form.controls.fullName.hasError('required')) {
          Full name is required.
        } @else {
          Keep it under 200 characters.
        }
      </p>
    }
  </label>

  <label class="field">
    <span class="field-label">Email Address</span>
    <span class="input-wrap" [class.invalid]="showError('email')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m4 7 8 6 8-6" />
      </svg>
      <input type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
    </span>
    @if (showError('email')) {
      <p class="field-error">
        @if (form.controls.email.hasError('required')) {
          Email is required.
        } @else {
          Enter a valid email address.
        }
      </p>
    }
  </label>

  <label class="field">
    <span class="field-label">Password</span>
    <span class="input-wrap" [class.invalid]="showError('password')">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17 10V8A5 5 0 0 0 7 8v2a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM9 8a3 3 0 0 1 6 0v2H9z" />
      </svg>
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        placeholder="At least 8 characters"
        autocomplete="new-password"
      />
      <button
        type="button"
        class="icon-button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Hide passwords' : 'Show passwords'"
        [attr.aria-pressed]="showPassword()"
      >
        @if (showPassword()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        }
      </button>
    </span>
    @if (showError('password')) {
      <p class="field-error">
        @if (form.controls.password.hasError('required')) {
          Password is required.
        } @else if (form.controls.password.hasError('minlength')) {
          Password must be at least 8 characters.
        } @else {
          Password must be 128 characters or fewer.
        }
      </p>
    } @else {
      <p class="field-hint">Use 8 or more characters.</p>
    }
  </label>

  <label class="field">
    <span class="field-label">Confirm Password</span>
    <span class="input-wrap" [class.invalid]="showError('confirmPassword')">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17 10V8A5 5 0 0 0 7 8v2a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM9 8a3 3 0 0 1 6 0v2H9z" />
      </svg>
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Re-enter your password"
        autocomplete="new-password"
      />
    </span>
    @if (showError('confirmPassword')) {
      <p class="field-error">
        @if (form.controls.confirmPassword.hasError('required')) {
          Please confirm your password.
        } @else {
          Passwords do not match.
        }
      </p>
    }
  </label>

  <button type="submit" class="btn-primary" [disabled]="submitting()">
    @if (submitting()) {
      <span class="spinner" aria-hidden="true"></span>
      <span class="sr-only">Creating account</span>
    } @else {
      Create Account
      <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    }
  </button>
</form>

<app-social-buttons />

<p class="switch-prompt">Already have an account? <a routerLink="/login">Sign in</a></p>
